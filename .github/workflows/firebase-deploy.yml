# Publica la web, la función del Excel y las reglas de Firestore en Firebase al subir cambios a main.
# Secretos de GitHub: FIREBASE_SERVICE_ACCOUNT (JSON de la cuenta de servicio, con rol Propietario)
# y EXCEL_CLAVE, IBAN y TITULAR, que se copian a Secret Manager para la función.
name: Publicar en Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FIREBASE_PROJECT: bodipo-business-1d955

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Comprobar la clave de Firebase
        id: clave
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::Falta el secreto FIREBASE_SERVICE_ACCOUNT; no se publica en Firebase."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.clave.outputs.hay == 'si'
      - uses: actions/setup-node@v4
        if: steps.clave.outputs.hay == 'si'
        with:
          node-version: 20
      - uses: google-github-actions/auth@v2
        if: steps.clave.outputs.hay == 'si'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.clave.outputs.hay == 'si'
      - name: Preparar el proyecto (APIs, base de datos y secretos)
        id: prep
        if: steps.clave.outputs.hay == 'si'
        env:
          EXCEL_CLAVE: ${{ secrets.EXCEL_CLAVE }}
          IBAN: ${{ secrets.IBAN }}
          TITULAR: ${{ secrets.TITULAR }}
        run: |
          P="$FIREBASE_PROJECT"
          gcloud services enable firebasehosting.googleapis.com firestore.googleapis.com --project "$P"
          # La función del Excel necesita el plan Blaze; sin él se publica solo la web.
          if ! gcloud services enable secretmanager.googleapis.com cloudfunctions.googleapis.com \
              cloudbuild.googleapis.com artifactregistry.googleapis.com run.googleapis.com \
              eventarc.googleapis.com --project "$P"; then
            echo "::warning::El proyecto no tiene el plan Blaze; se publica solo la web, sin la función del Excel."
            echo "blaze=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "blaze=si" >> "$GITHUB_OUTPUT"
          gcloud firestore databases describe --database='(default)' --project "$P" >/dev/null 2>&1 \
            || gcloud firestore databases create --location=eur3 --project "$P"
          # Solo se crea una versión nueva cuando el valor cambia.
          for NOMBRE in EXCEL_CLAVE IBAN TITULAR; do
            VALOR="${!NOMBRE}"
            if ! gcloud secrets describe "$NOMBRE" --project "$P" >/dev/null 2>&1; then
              gcloud secrets create "$NOMBRE" --replication-policy=automatic --project "$P"
              # Valor provisional para que la función se pueda publicar; la función lo ignora.
              [ -z "$VALOR" ] && printf '%s' '-' | gcloud secrets versions add "$NOMBRE" --data-file=- --project "$P"
            fi
            [ -z "$VALOR" ] && { echo "::warning::Falta el secreto $NOMBRE en GitHub."; continue; }
            ACTUAL="$(gcloud secrets versions access latest --secret "$NOMBRE" --project "$P" 2>/dev/null || true)"
            if [ "$ACTUAL" != "$VALOR" ]; then
              printf '%s' "$VALOR" | gcloud secrets versions add "$NOMBRE" --data-file=- --project "$P"
            fi
          done
      - name: Construir la web
        if: steps.clave.outputs.hay == 'si'
        run: |
          npm ci
          npm run build
          npm ci --prefix functions
      - name: Publicar
        if: steps.clave.outputs.hay == 'si'
        run: |
          if [ "${{ steps.prep.outputs.blaze }}" = "si" ]; then
            npx --yes firebase-tools@13 deploy --project "$FIREBASE_PROJECT" --only hosting,functions,firestore:rules --force --non-interactive
          else
            # Sin la función, el seguimiento sigue en Hostinger (bodipobusiness.com): Firebase
            # sirve solo la app, también en la raíz, y se quitan las rutas de la función.
            rm -f dist/index.html
            node -e "const f=require('./firebase.json');f.hosting.rewrites=f.hosting.rewrites.filter(r=>!r.function);require('fs').writeFileSync('firebase.json',JSON.stringify(f,null,2))"
            npx --yes firebase-tools@13 deploy --project "$FIREBASE_PROJECT" --only hosting --non-interactive
          fi
