name: Sonda Render
on:
  push:
    branches: [sonda-render]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for o in https://bodipobusiness.com https://www.bodipobusiness.com; do
            echo "== preflight $o"
            curl -sS -m 60 -o /dev/null -D - -X OPTIONS -H "Origin: $o" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' https://bodipo-business-api.onrender.com/api/auth/register | grep -i "^HTTP\|access-control" || true
            echo "== post $o"
            curl -sS -m 60 -X POST -H "Origin: $o" -H 'Content-Type: application/json' -d '{"name":"x","email":"no-valido","password":"x"}' -D - https://bodipo-business-api.onrender.com/api/auth/register -o body.txt | grep -i "^HTTP\|access-control" || true; head -c 200 body.txt; echo
          done
          curl -sS -m 30 https://bodipo-business-api.onrender.com/api/health; echo
