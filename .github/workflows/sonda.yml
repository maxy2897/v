name: Sonda Render
on:
  push:
    branches: [sonda-render]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 90 https://bodipo-business-api.onrender.com/api/health; echo
          for o in https://bodipobusiness.com https://www.bodipobusiness.com; do
            echo "== login $o"
            curl -sS -m 60 -X POST -H "Origin: $o" -H 'Content-Type: application/json' -d '{"email":"nadie@ejemplo.com","password":"x"}' -D - https://bodipo-business-api.onrender.com/api/auth/login -o body.txt | grep -i "^HTTP\|access-control" || true; head -c 200 body.txt; echo
            echo "== social $o"
            curl -sS -m 60 -X POST -H "Origin: $o" -H 'Content-Type: application/json' -d '{"idToken":"x"}' -D - https://bodipo-business-api.onrender.com/api/auth/social-login -o body.txt | grep -i "^HTTP\|access-control" || true; head -c 200 body.txt; echo
          done
